name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: huz-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deploy key availability
        shell: bash
        env:
          HUZ_GITHUB_DEPLOY_KEY: ${{ secrets.HUZ_GITHUB_DEPLOY_KEY }}
        run: |
          if [ -z "${HUZ_GITHUB_DEPLOY_KEY}" ]; then
            echo "Missing HUZ_GITHUB_DEPLOY_KEY secret." >&2
            exit 1
          fi

      - name: Write deploy key
        shell: bash
        env:
          HUZ_GITHUB_DEPLOY_KEY: ${{ secrets.HUZ_GITHUB_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%b\n' "${HUZ_GITHUB_DEPLOY_KEY}" | tr -d '\r' > ~/.ssh/huz_deploy_key
          chmod 600 ~/.ssh/huz_deploy_key

      - name: Validate deploy key format
        shell: bash
        run: |
          ssh-keygen -y -f ~/.ssh/huz_deploy_key > /dev/null

      - name: Trust production host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 64.227.173.238 >> ~/.ssh/known_hosts

      - name: Trigger production deploy
        shell: bash
        run: |
          ssh -i ~/.ssh/huz_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            huz@64.227.173.238 \
            'bash -s' < scripts/deploy_production_backend.sh

      - name: Verify production canonical routes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          checks = [
              ("POST", "https://hajjumrah.org/api/v1/operator/auth/login/", {}),
              ("POST", "https://hajjumrah.org/api/v1/auth/users/exists/", {}),
              ("GET", "https://hajjumrah.org/api/v1/packages/public/", None),
          ]

          allowed_statuses = {200, 400, 401, 403, 405}

          for method, url, payload in checks:
              request = urllib.request.Request(url, method=method)
              if payload is not None:
                  body = json.dumps(payload).encode()
                  request.add_header("Content-Type", "application/json")
              else:
                  body = None

              try:
                  with urllib.request.urlopen(request, data=body, timeout=20) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code

              print(method, url, status)
              if status not in allowed_statuses:
                  print(f"Unexpected production status for {url}: {status}", file=sys.stderr)
                  sys.exit(1)
          PY
